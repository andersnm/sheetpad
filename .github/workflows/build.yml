name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ g++-mingw-w64-x86-64-posix

      - name: Test core (native)
        run: |
          cmake -S . -B build-native -G Ninja
          cmake --build build-native
          ./build-native/core_tests

      - name: Build Sheetpad.exe (MinGW-w64 cross-build)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
          cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sheetpad-windows-x64
          path: build/Sheetpad.exe
          if-no-files-found: error

  # Tag pushes (v*) publish the tested exe as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the tested exe
        uses: actions/download-artifact@v4
        with:
          name: Sheetpad-windows-x64
          path: dist

      - name: Package portable zip
        run: |
          zip -j "dist/Sheetpad-${GITHUB_REF_NAME}-win-x64.zip" dist/Sheetpad.exe README.md LICENSE

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Sheetpad.exe
            dist/Sheetpad-*-win-x64.zip
          generate_release_notes: true
